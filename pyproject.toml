[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.6",
  "dateparser>=1.2",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "icalendar>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "pre-commit","hypothesis", "httpx2>=2.0.0",]
ui = ["streamlit>=1.35"]
audio = ["faster-whisper>=1.0", "pyannote.audio>=3.1"]

[project.scripts]
copilot = "copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real LLM providers"]
