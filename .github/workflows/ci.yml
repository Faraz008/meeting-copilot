name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/split_integrity.py
      - run: python scripts/check_secrets.py
      - run: pytest -q --cov=copilot --cov-report=term-missing --cov-fail-under=70
      - run: python scripts/validate_gold.py
  eval-replay:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: python scripts/ci_eval.py
